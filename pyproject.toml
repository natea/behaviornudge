[project]
name = "behaviornudge"
version = "0.1.0"
description = "Predict and pre-empt attention drift from local screen-activity data"
readme = "README.md"
authors = [
    { name = "Nate Aune", email = "natejaune@gmail.com" }
]
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "behaviorgpt>=0.10.0",
    "mcp>=2.3.0",
    "pandas>=3.1.1",
    "pyarrow>=26.0.1",
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
behaviornudge = "behaviornudge.cli:main"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
